<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087e96"><meta name="format-detection" content="telephone=no"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%23087e96%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2771%27%20font-family%3D%27Georgia%2Cserif%27%20font-size%3D%2758%27%20fill%3D%27%23f6f1e8%27%20text-anchor%3D%27middle%27%3EA%3C/text%3E%3C/svg%3E"><meta name="robots" content="noindex, nofollow"><title>Edit Project — A Cube Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#087e96;--teal2:#0e9ab0;--orange:#ed861f;--rust:#a84b2d;--ink:#252725;--muted:#6d6d67;--cream:#f6f1e8;--paper:#fbf9f4;--sand:#ddccb1;--line:rgba(37,39,37,.14);--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans)}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}
.header{height:86px;padding:15px 5.5vw;display:flex;align-items:center;gap:42px;position:fixed;z-index:20;top:0;left:0;width:100%;background:rgba(246,241,232,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{width:174px;background:var(--paper);padding:7px 12px;font-family:var(--serif);font-size:25px}.header nav{display:flex;gap:32px;margin-left:auto}.header nav a{font-size:10px;letter-spacing:.15em;text-transform:uppercase}.header nav a:hover{color:var(--teal)}
.page{padding:145px 10vw 110px;max-width:1450px;margin:auto}.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);font-weight:700}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.045em}h1{font-size:clamp(60px,8vw,110px);line-height:.82;margin:25px 0 38px}h1 em,h2 em{font-style:italic;color:var(--rust);font-weight:400}
h2{font-size:65px;line-height:.9;margin:0 0 35px}.description{max-width:650px;color:var(--muted);font-size:14px;line-height:1.9}
.project-hero{display:grid;grid-template-columns:.85fr 1.15fr;gap:75px;align-items:end}.project-main-image{width:100%;height:650px;object-fit:cover;background:var(--sand)}.meta{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);margin-bottom:12px}
.gallery-section{padding-top:120px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.gallery figure{margin:0}.gallery img{width:100%;height:500px;object-fit:cover;background:var(--sand)}.gallery figure:nth-child(3n){grid-column:1/-1}.gallery figure:nth-child(3n) img{height:650px}.caption{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:10px 0}
footer{background:#202523;color:var(--cream);padding:58px 10vw 22px;margin-top:50px}.footer-admin{display:inline-block;font-size:8px;letter-spacing:.16em;color:#d8b58d;margin-top:20px;border-bottom:1px solid #d8b58d;padding-bottom:4px}
.admin-page{min-height:100vh;padding:125px 6vw 80px}.admin-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px}.admin-head h1{font-size:72px;margin:15px 0 0}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);background:transparent;padding:13px 18px;font-size:9px;text-transform:uppercase;letter-spacing:.15em;cursor:pointer}.btn:hover{background:var(--ink);color:var(--cream)}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.primary:disabled{opacity:.55;cursor:default}.btn.danger{border-color:#a84b2d;color:#a84b2d}.btn.danger:hover{background:#a84b2d;color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);padding:28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}.stat{background:var(--cream);padding:22px}.stat b{display:block;font-family:var(--serif);font-size:42px;font-weight:500}.stat span{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.project-table{width:100%;border-collapse:collapse}.project-table th,.project-table td{padding:15px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:11px}.project-thumb{width:82px;height:62px;object-fit:cover;background:var(--sand)}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:7px 9px;background:rgba(8,126,150,.08);color:var(--teal)}.status.draft{background:rgba(168,75,45,.08);color:var(--rust)}
.form-card{max-width:1000px;margin:auto;background:var(--paper);border:1px solid var(--line);padding:35px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--rust)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;padding:13px;outline:none;color:var(--ink)}textarea{min-height:150px;resize:vertical}.required{color:var(--rust)}.help{font-size:10px;color:var(--muted);line-height:1.6}.check{display:flex;align-items:center;gap:9px;font-size:10px}.check input{width:auto}
.message{padding:12px 14px;margin-bottom:18px;font-size:11px;background:rgba(8,126,150,.08);color:var(--teal)}.message.error{background:rgba(168,75,45,.08);color:var(--rust)}
.login-page{min-height:100vh;display:grid;place-items:center;padding:30px}.login-card{width:min(450px,100%);background:var(--paper);border:1px solid var(--line);padding:42px}.login-card h1{font-size:65px;margin:20px 0 35px}.login-card .field{margin-bottom:18px}
.empty{padding:55px 20px;text-align:center;color:var(--muted);font-size:12px}

@media(max-width:900px){.header{height:74px;padding:12px 6vw}.header nav{display:none}.logo{width:150px}.page{padding:120px 7vw 80px}.project-hero{grid-template-columns:1fr;gap:35px}.project-main-image{height:500px}.gallery{grid-template-columns:1fr}.gallery figure:nth-child(3n){grid-column:auto}.gallery img,.gallery figure:nth-child(3n) img{height:430px}.admin-head{display:block}.admin-head h1{font-size:58px}.stats{grid-template-columns:1fr 1fr}.project-table{display:block;overflow-x:auto;white-space:nowrap}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.form-card{padding:23px}}

/* Admin-only clean layout: no public-site navigation header */
.admin-clean-body{background:var(--cream)}
.admin-clean-body .header{display:none}
.admin-clean-body footer{display:none}

/* ChatGPT-style image attachment composer */
.gallery-composer,.main-composer{margin-top:12px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;transition:.2s}
.gallery-composer:focus-within,.main-composer:focus-within{border-color:rgba(8,126,150,.45);box-shadow:0 0 0 3px rgba(8,126,150,.06)}
.gallery-attachments{display:flex;flex-wrap:wrap;gap:9px;min-height:10px}
.gallery-attachment,.main-attachment{position:relative;border-radius:10px;overflow:visible;background:var(--cream);border:1px solid var(--line)}
.gallery-attachment{width:92px;height:92px;flex:0 0 92px}
.main-attachment{width:150px;height:105px}
.gallery-attachment img,.main-attachment img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
.attachment-x{position:absolute;top:-7px;right:-7px;width:22px;height:22px;padding:0;border:1px solid rgba(37,39,37,.16);border-radius:50%;background:#fff;color:#252725;display:grid;place-items:center;font-size:14px;line-height:1;cursor:pointer;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.attachment-x:hover{background:var(--rust);color:#fff;border-color:var(--rust)}
.attachment-existing{position:absolute;left:5px;bottom:5px;padding:3px 6px;border-radius:5px;background:rgba(0,0,0,.58);color:#fff;font-size:7px;letter-spacing:.08em;text-transform:uppercase}
.gallery-add-row{display:flex;align-items:center;gap:9px;padding-top:10px;margin-top:2px}
.gallery-add-button{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;background:var(--cream);display:grid;place-items:center;cursor:pointer;font-size:20px;color:var(--ink)}
.gallery-add-button:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.gallery-add-text{font-size:10px;color:var(--muted)}
.gallery-empty{font-size:10px;color:#8a877f;padding:6px 3px;width:100%}
.gallery-hidden-input{display:none}
.header .logo img{display:block;width:145px;max-height:66px;object-fit:contain}.header .logo{display:flex;align-items:center}
</style></head><body class="admin-clean-body">
<main class="admin-page"><div class="admin-head"><div><div class="eyebrow">A Cube Admin</div><h1 id="title">Edit <em>Project</em></h1></div><a class="btn" href="admin.html">← Dashboard</a></div>
<div class="form-card"><div id="msg" class="message" style="display:none"></div>
<div class="form-grid">
<div class="field full"><label>Project Name <span class="required">*</span></label><input id="name" required></div>
<div class="field"><label>Category</label><input id="category" placeholder="Residential"></div><div class="field"><label>Location</label><input id="location" placeholder="Ballari, Karnataka"></div>
<div class="field full"><label>Short Description</label><textarea id="short_description" style="min-height:90px"></textarea></div>
<div class="field full"><label>Full Description</label><textarea id="description"></textarea></div>
<div class="field full">
<label>Main Image <span class="required">*</span></label>
<div class="main-composer">
  <div id="mainPreview"></div>
  <div class="gallery-add-row">
    <button type="button" class="gallery-add-button" onclick="document.getElementById('mainFile').click()" aria-label="Change main image">+</button>
    <span class="gallery-add-text">Change main image</span>
  </div>
  <input id="mainFile" class="gallery-hidden-input" type="file" accept="image/*">
</div>
<div class="help">This image is displayed in the Projects section on the main index page.</div>
</div>
<div class="field full">
<label>Project Gallery Images</label>
<div class="gallery-composer">
  <div id="galleryPreview" class="gallery-attachments"><div class="gallery-empty">Loading…</div></div>
  <div class="gallery-add-row"><button type="button" class="gallery-add-button" onclick="document.getElementById('galleryFiles').click()" aria-label="Add gallery images">+</button><span class="gallery-add-text">Add images</span></div>
  <input id="galleryFiles" class="gallery-hidden-input" type="file" accept="image/*" multiple>
</div>
</div>
<div class="field" style="justify-content:end"><label class="check"><input id="published" type="checkbox" checked> Publish project</label></div>
</div>
<div class="actions" style="margin-top:30px"><button class="btn primary" id="saveBtn" onclick="save()">Save Project</button><a class="btn" href="admin.html">Cancel</a></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://wixaatcfvycalzfoheyn.supabase.co","sb_publishable_3w5sC7ayULa77QG203kgTQ_flCqh5wJ"),editId=new URLSearchParams(location.search).get("id");
let galleryQueue=[],existingImages=[],mainFileObj=null,existingMainUrl=null,wasPublished=false;
// "name" and "location" clash with the browser's built-in window.name / window.location,
// so we grab these two fields explicitly instead of relying on the id-as-global shortcut.
const nameInput=document.getElementById("name"),locationInput=document.getElementById("location");

async function guard(){const {data}=await db.auth.getSession();if(!data.session)location.replace("admin-login.html")}
window.addEventListener("pageshow",e=>{if(e.persisted)location.reload()});

function showError(t){msg.className="message error";msg.textContent=t;msg.style.display="block"}

function previewMain(){
  mainPreview.innerHTML="";
  if(mainFileObj){
    const u=URL.createObjectURL(mainFileObj);
    mainPreview.innerHTML=`<div class="main-attachment"><img src="${u}" alt="Main image"><button type="button" class="attachment-x" onclick="removeMain()" aria-label="Remove main image">×</button></div>`;
  }else if(existingMainUrl){
    mainPreview.innerHTML=`<div class="main-attachment"><img src="${existingMainUrl}" alt="Current main image"><button type="button" class="attachment-x" onclick="removeMain()" aria-label="Remove main image">×</button><span class="attachment-existing">Current</span></div>`;
  }
}
function removeMain(){
  mainFileObj=null;
  existingMainUrl=null;
  mainFile.value="";
  previewMain();
}
mainFile.onchange=()=>{mainFileObj=mainFile.files[0]||null;previewMain()};

galleryFiles.onchange=()=>{
  galleryQueue.push(...Array.from(galleryFiles.files));
  renderGallery();
  galleryFiles.value="";
};
function renderGallery(){
  let html="";
  if(!existingImages.length && !galleryQueue.length){
    html='<div class="gallery-empty">No images added yet. Use + to add project images.</div>';
  }else{
    html += existingImages.map((img,idx)=>`
      <div class="gallery-attachment">
        <img src="${img.image_url}" alt="Existing gallery image">
        <button type="button" class="attachment-x" onclick="deleteExisting('${img.id}',${idx})" aria-label="Delete image">×</button>
        <span class="attachment-existing">Saved</span>
      </div>`).join("");
    html += galleryQueue.map((f,i)=>`
      <div class="gallery-attachment">
        <img src="${URL.createObjectURL(f)}" alt="">
        <button type="button" class="attachment-x" onclick="removeQueued(${i})" aria-label="Remove image">×</button>
      </div>`).join("");
  }
  galleryPreview.innerHTML=html;
}
function removeQueued(i){
  galleryQueue.splice(i,1);
  renderGallery();
}
function storagePath(url){
  try{
    const u=new URL(url);
    const marker="/storage/v1/object/public/project-images/";
    const i=u.pathname.indexOf(marker);
    return i>=0 ? decodeURIComponent(u.pathname.slice(i+marker.length)) : null;
  }catch(e){return null}
}
async function deleteExisting(id,idx){
  if(!confirm("Delete this image from the project?"))return;
  try{
    const img=existingImages[idx];
    const path=storagePath(img.image_url);
    if(path) await db.storage.from("project-images").remove([path]);
    const {error}=await db.from("project_images").delete().eq("id",id);
    if(error)throw error;
    existingImages.splice(idx,1);
    renderGallery();
  }catch(e){
    showError(e.message||String(e));
  }
}

async function upload(file,folder){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
  const path=`${folder}/${crypto.randomUUID()}.${ext}`;
  const {error}=await db.storage.from("project-images").upload(path,file);
  if(error)throw error;
  return db.storage.from("project-images").getPublicUrl(path).data.publicUrl;
}

async function load(){
  await guard();
  if(!editId){showError("No project id given.");saveBtn.disabled=true;return}
  const {data:p,error}=await db.from("projects").select("*").eq("id",editId).single();
  if(error){showError(error.message);return}
  nameInput.value=p.name||"";
  category.value=p.category||"";
  locationInput.value=p.location||"";
  short_description.value=p.short_description||"";
  description.value=p.description||"";
  published.checked=!!p.is_published;
  wasPublished=!!p.is_published;
  existingMainUrl=p.main_image||null;
  previewMain();
  const r=await db.from("project_images").select("*").eq("project_id",editId).order("display_order");
  existingImages=r.data||[];
  renderGallery();
}

async function save(){
  msg.style.display="none";
  saveBtn.disabled=true;saveBtn.textContent="Saving…";
  try{
    if(!editId){throw new Error("No project id given.")}
    const nameVal=nameInput.value.trim();
    if(!nameVal){throw new Error("Project name is required.")}
    if(!mainFileObj && !existingMainUrl){throw new Error("A main image is required.")}

    let mainUrl=existingMainUrl;
    if(mainFileObj) mainUrl=await upload(mainFileObj,"main");
    const isPublished=published.checked;

    const updates={
      name:nameVal,
      category:category.value.trim()||null,
      location:locationInput.value.trim()||null,
      short_description:short_description.value.trim()||null,
      description:description.value.trim()||null,
      main_image:mainUrl,
      is_published:isPublished,
      updated_at:new Date().toISOString()
    };
    if(isPublished && !wasPublished) updates.published_at=new Date().toISOString();

    const {error}=await db.from("projects").update(updates).eq("id",editId);
    if(error)throw error;

    if(galleryQueue.length){
      const urls=await Promise.all(galleryQueue.map(f=>upload(f,"gallery")));
      const startOrder=existingImages.length;
      const rows=urls.map((u,i)=>({project_id:editId,image_url:u,display_order:startOrder+i}));
      const {error:gErr}=await db.from("project_images").insert(rows);
      if(gErr)throw gErr;
    }

    window.location.replace("admin.html");
  }catch(e){
    showError(e.message||String(e));
    saveBtn.disabled=false;saveBtn.textContent="Save Project";
  }
}

function slugify(s){return s.toLowerCase().trim().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
load();
</script></body></html>
