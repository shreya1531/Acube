<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#087e96"><meta name="format-detection" content="telephone=no"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%23087e96%27/%3E%3Ctext%20x%3D%2750%27%20y%3D%2771%27%20font-family%3D%27Georgia%2Cserif%27%20font-size%3D%2758%27%20fill%3D%27%23f6f1e8%27%20text-anchor%3D%27middle%27%3EA%3C/text%3E%3C/svg%3E"><meta name="robots" content="noindex, nofollow"><title>Project Dashboard — A Cube Design Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#087e96;--teal2:#0e9ab0;--orange:#ed861f;--rust:#a84b2d;--ink:#252725;--muted:#6d6d67;--cream:#f6f1e8;--paper:#fbf9f4;--sand:#ddccb1;--line:rgba(37,39,37,.14);--serif:"Cormorant Garamond",Georgia,serif;--sans:"DM Sans",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans)}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}
.header{height:86px;padding:15px 5.5vw;display:flex;align-items:center;gap:42px;position:fixed;z-index:20;top:0;left:0;width:100%;background:rgba(246,241,232,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{width:174px;background:var(--paper);padding:7px 12px;font-family:var(--serif);font-size:25px}.header nav{display:flex;gap:32px;margin-left:auto}.header nav a{font-size:10px;letter-spacing:.15em;text-transform:uppercase}.header nav a:hover{color:var(--teal)}
.page{padding:145px 10vw 110px;max-width:1450px;margin:auto}.eyebrow{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);font-weight:700}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.045em}h1{font-size:clamp(60px,8vw,110px);line-height:.82;margin:25px 0 38px}h1 em,h2 em{font-style:italic;color:var(--rust);font-weight:400}
h2{font-size:65px;line-height:.9;margin:0 0 35px}.description{max-width:650px;color:var(--muted);font-size:14px;line-height:1.9}
.project-hero{display:grid;grid-template-columns:.85fr 1.15fr;gap:75px;align-items:end}.project-main-image{width:100%;height:650px;object-fit:cover;background:var(--sand)}.meta{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--rust);margin-bottom:12px}
.gallery-section{padding-top:120px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.gallery figure{margin:0}.gallery img{width:100%;height:500px;object-fit:cover;background:var(--sand)}.gallery figure:nth-child(3n){grid-column:1/-1}.gallery figure:nth-child(3n) img{height:650px}.caption{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:10px 0}
footer{background:#202523;color:var(--cream);padding:58px 10vw 22px;margin-top:50px}.footer-admin{display:inline-block;font-size:8px;letter-spacing:.16em;color:#d8b58d;margin-top:20px;border-bottom:1px solid #d8b58d;padding-bottom:4px}
.admin-page{min-height:100vh;padding:125px 6vw 80px}.admin-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:40px}.admin-head h1{font-size:72px;margin:15px 0 0}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--ink);background:transparent;padding:13px 18px;font-size:9px;text-transform:uppercase;letter-spacing:.15em;cursor:pointer}.btn:hover{background:var(--ink);color:var(--cream)}.btn.primary{background:var(--teal);border-color:var(--teal);color:white}.btn.danger{border-color:#a84b2d;color:#a84b2d}.btn.danger:hover{background:#a84b2d;color:#fff}
.panel{background:var(--paper);border:1px solid var(--line);padding:28px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:22px}.stat{background:var(--cream);padding:22px}.stat b{display:block;font-family:var(--serif);font-size:42px;font-weight:500}.stat span{font-size:8px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.project-table{width:100%;border-collapse:collapse}.project-table th,.project-table td{padding:15px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:11px}.project-thumb{width:82px;height:62px;object-fit:cover;background:var(--sand)}.actions{display:flex;gap:7px;flex-wrap:wrap}.status{font-size:8px;letter-spacing:.12em;text-transform:uppercase;padding:7px 9px;background:rgba(8,126,150,.08);color:var(--teal)}.status.draft{background:rgba(168,75,45,.08);color:var(--rust)}
.form-card{max-width:1000px;margin:auto;background:var(--paper);border:1px solid var(--line);padding:35px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-size:9px;text-transform:uppercase;letter-spacing:.16em;color:var(--rust)}input,textarea,select{width:100%;border:1px solid var(--line);background:#fff;padding:13px;outline:none;color:var(--ink)}textarea{min-height:150px;resize:vertical}.required{color:var(--rust)}.help{font-size:10px;color:var(--muted);line-height:1.6}.check{display:flex;align-items:center;gap:9px;font-size:10px}.check input{width:auto}
.upload-preview{margin-top:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.preview-card{position:relative;background:var(--cream);border:1px solid var(--line);padding:7px}.preview-card img{width:100%;height:145px;object-fit:cover}.preview-remove{position:absolute;right:6px;top:6px;border:0;background:white;width:27px;height:27px;border-radius:50%;cursor:pointer;font-size:17px;line-height:1}.preview-label{font-size:8px;letter-spacing:.1em;color:var(--muted);padding:7px 2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main-preview{max-width:300px;margin-top:12px;position:relative}.main-preview img{width:100%;height:200px;object-fit:cover}.message{padding:12px 14px;margin-bottom:18px;font-size:11px;background:rgba(8,126,150,.08);color:var(--teal)}.message.error{background:rgba(168,75,45,.08);color:var(--rust)}
.login-page{min-height:100vh;display:grid;place-items:center;padding:30px}.login-card{width:min(450px,100%);background:var(--paper);border:1px solid var(--line);padding:42px}.login-card h1{font-size:65px;margin:20px 0 35px}.login-card .field{margin-bottom:18px}
.empty{padding:55px 20px;text-align:center;color:var(--muted);font-size:12px}
.gallery-admin-thumbs{display:flex;gap:5px;flex-wrap:wrap;max-width:330px}
.gallery-admin-thumb{position:relative;width:46px;height:38px;flex:0 0 46px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.gallery-admin-thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:5px}
.gallery-admin-thumb button{position:absolute;right:-5px;top:-5px;width:17px;height:17px;border:0;border-radius:50%;background:#fff;color:#a84b2d;font-size:12px;line-height:17px;padding:0;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.15)}
.gallery-admin-thumb button:hover{background:#a84b2d;color:#fff}

@media(max-width:900px){.header{height:74px;padding:12px 6vw}.header nav{display:none}.logo{width:150px}.page{padding:120px 7vw 80px}.project-hero{grid-template-columns:1fr;gap:35px}.project-main-image{height:500px}.gallery{grid-template-columns:1fr}.gallery figure:nth-child(3n){grid-column:auto}.gallery img,.gallery figure:nth-child(3n) img{height:430px}.admin-head{display:block}.admin-head h1{font-size:58px}.stats{grid-template-columns:1fr 1fr}.project-table{display:block;overflow-x:auto;white-space:nowrap}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.upload-preview{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.form-card{padding:23px}.upload-preview{grid-template-columns:1fr 1fr}}

/* Admin-only clean layout: no public-site navigation header */
.admin-clean-body{background:var(--cream)}
.admin-clean-body .header{display:none}
.admin-clean-body footer{display:none}

/* ChatGPT-style image attachment composer */
.gallery-composer{
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:12px;
  transition:.2s;
}
.gallery-composer:focus-within{
  border-color:rgba(8,126,150,.45);
  box-shadow:0 0 0 3px rgba(8,126,150,.06);
}
.gallery-attachments{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  min-height:10px;
}
.gallery-attachment{
  position:relative;
  width:92px;
  height:92px;
  border-radius:10px;
  overflow:visible;
  flex:0 0 92px;
  background:var(--cream);
  border:1px solid var(--line);
}
.gallery-attachment img{
  width:100%;
  height:100%;
  object-fit:cover;
  border-radius:9px;
  display:block;
}
.gallery-attachment .attachment-x{
  position:absolute;
  top:-7px;
  right:-7px;
  width:22px;
  height:22px;
  border:1px solid rgba(37,39,37,.16);
  border-radius:50%;
  background:#fff;
  color:#252725;
  display:grid;
  place-items:center;
  font-size:14px;
  line-height:1;
  cursor:pointer;
  z-index:3;
  box-shadow:0 2px 8px rgba(0,0,0,.14);
}
.gallery-attachment .attachment-x:hover{
  background:var(--rust);
  color:#fff;
  border-color:var(--rust);
}
.gallery-attachment .attachment-existing{
  position:absolute;
  left:5px;
  bottom:5px;
  padding:3px 5px;
  border-radius:5px;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:7px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.gallery-add-row{
  display:flex;
  align-items:center;
  gap:9px;
  padding-top:10px;
}
.gallery-add-button{
  width:34px;
  height:34px;
  border:1px solid var(--line);
  border-radius:9px;
  background:var(--cream);
  display:grid;
  place-items:center;
  cursor:pointer;
  font-size:20px;
  color:var(--ink);
}
.gallery-add-button:hover{background:var(--teal);color:#fff;border-color:var(--teal)}
.gallery-add-text{
  font-size:10px;
  color:var(--muted);
}
.gallery-empty{
  font-size:10px;
  color:#8a877f;
  padding:6px 3px;
}
.gallery-hidden-input{display:none}
.main-composer{
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  padding:12px;
}
.main-composer .main-attachment{
  width:150px;height:105px;position:relative;border-radius:10px;
  overflow:visible;background:var(--cream);border:1px solid var(--line);
}
.main-composer .main-attachment img{width:100%;height:100%;object-fit:cover;border-radius:9px}
.main-composer .attachment-x{
  position:absolute;top:-7px;right:-7px;width:22px;height:22px;border:1px solid rgba(37,39,37,.16);
  border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer;z-index:3
}

.header .logo img{display:block;width:145px;max-height:66px;object-fit:contain}.header .logo{display:flex;align-items:center}
</style></head><body class="admin-clean-body">
<main class="admin-page"><div class="admin-head"><div><div class="eyebrow">A Cube Admin</div><h1>Project <em>Dashboard</em></h1></div><div class="actions"><a class="btn primary" href="admin-add-project.html">+ New Project</a><button class="btn" onclick="logout()">Logout</button></div></div>
<div class="stats"><div class="stat"><b id="total">0</b><span>Total Projects</span></div><div class="stat"><b id="published">0</b><span>Published</span></div><div class="stat"><b id="drafts">0</b><span>Drafts</span></div></div>
<div class="panel"><div id="msg" class="message" style="display:none"></div><div style="overflow:auto"><table class="project-table"><thead><tr><th>Preview</th><th>Project</th><th>Category</th><th>Gallery</th><th>Published Month</th><th>Status</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient("https://wixaatcfvycalzfoheyn.supabase.co","sb_publishable_3w5sC7ayULa77QG203kgTQ_flCqh5wJ");
let allGalleryImages=[];
async function guard(){const {data}=await db.auth.getSession();if(!data.session)location.replace("admin-login.html")}
// If the page is restored from the back/forward cache (e.g. the browser's
// Back button after Logout), force a fresh load so guard() re-checks the
// session instead of showing a stale, already-rendered dashboard.
window.addEventListener("pageshow",e=>{if(e.persisted)location.reload()});
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function publishedMonth(p){
 const d=new Date(p.published_at || p.created_at);
 return d.toLocaleDateString("en-US",{month:"short",year:"numeric"});
}
function storagePath(url){
 try{
   const u=new URL(url);
   const marker="/storage/v1/object/public/project-images/";
   const i=u.pathname.indexOf(marker);
   return i>=0 ? decodeURIComponent(u.pathname.slice(i+marker.length)) : null;
 }catch(e){return null}
}
async function deleteGalleryImage(image){
 if(!confirm("Delete this image from the project?")) return;
 const path=storagePath(image.image_url);
 if(path) await db.storage.from("project-images").remove([path]);
 const {error}=await db.from("project_images").delete().eq("id",image.id);
 if(error){alert(error.message);return}
 load();
}
async function load(){
 await guard();
 const [{data:projects,error:pError},{data:images,error:iError}]=await Promise.all([
   db.from("projects").select("*").order("created_at",{ascending:false}),
   db.from("project_images").select("*").order("display_order",{ascending:true})
 ]);
 if(pError||iError){msg.textContent=(pError||iError).message;msg.style.display="block";return}
 allGalleryImages=images||[];
 total.textContent=projects.length;
 published.textContent=projects.filter(p=>p.is_published).length;
 drafts.textContent=projects.filter(p=>!p.is_published).length;
 rows.innerHTML=projects.length?projects.map(p=>{
   const imgs=allGalleryImages.filter(i=>i.project_id===p.id);
   const thumbs=imgs.length
    ? `<div class="gallery-admin-thumbs">${imgs.map(i=>`<div class="gallery-admin-thumb"><img src="${i.image_url}" alt=""><button title="Delete image" onclick='deleteGalleryImage(${JSON.stringify(i).replace(/'/g,"&#39;")})'>×</button></div>`).join("")}</div>`
    : `<span style="font-size:9px;color:var(--muted)">No images</span>`;
   return `<tr>
     <td>${p.main_image?`<img class="project-thumb" src="${p.main_image}">`:"—"}</td>
     <td><strong>${esc(p.name)}</strong><br><span style="font-size:9px;color:var(--muted)">${esc(p.location||"")}</span></td>
     <td>${esc(p.category||"—")}</td>
     <td>${thumbs}</td>
     <td>${p.is_published?publishedMonth(p):"—"}</td>
     <td><span class="status ${p.is_published?"":"draft"}">${p.is_published?"Published":"Draft"}</span></td>
     <td><div class="actions"><a class="btn" href="admin-edit-project.html?id=${p.id}">Edit</a><button class="btn danger" onclick="del('${p.id}')">Delete</button></div></td>
   </tr>`;
 }).join(""):`<tr><td colspan="7"><div class="empty">No projects yet. Add your first project.</div></td></tr>`;
}
async function del(id){
 if(!confirm("Delete this project and all its gallery records?"))return;
 const imgs=allGalleryImages.filter(i=>i.project_id===id);
 const paths=imgs.map(i=>storagePath(i.image_url)).filter(Boolean);
 if(paths.length) await db.storage.from("project-images").remove(paths);
 const {error}=await db.from("projects").delete().eq("id",id);
 if(error)alert(error.message);else load();
}
async function logout(){await db.auth.signOut();location.replace("admin-login.html")}
load();
</script></body></html>
